change_detection:
  # Columns to ignore during comparison (timestamps, metadata, etc.)
  ignore_columns:
    - data_dict_id
    - export_date
    - export_timestamp
    - created_date
    - modified_date
    - last_updated
    - row_id
    - system_id

  # Thresholds for triggering conversion (lowered for better sensitivity)
  # Any single threshold being met will trigger conversion
  thresholds:
    # Minimum number of field changes to trigger conversion
    min_field_changes: 1

    # Minimum number of new instruments to trigger conversion
    min_new_instruments: 1

    # Minimum number of modified instruments to trigger conversion
    min_modified_instruments: 1

    # Minimum number of deleted instruments to trigger conversion
    min_deleted_instruments: 1

    # Minimum number of choice option changes to trigger conversion
    min_choice_changes: 1

    # Percentage of total fields that must change (0.01 = 0.01%)
    significant_change_percentage: 0.01

  # Normalization options
  ignore_whitespace: true
  ignore_case: true
  ignore_order: false

  # Key columns for identifying records (match CSV)
  key_columns:
    - full_instrument_name
    - name
    - field_type

  # Columns considered significant for change detection (match CSV)
  significant_columns:
    - field_type
    - loris_required
    - option_values
    - question
    - redcap_branching_logic
    - redcap_text_validation_min
    - redcap_text_validation_max
    - redcap_field_annotation

name: "Setup Python and dependencies"
description: "Set up Python and install required packages"
inputs:
  python-version:
    description: "Python version"
    required: false
    default: "3.10"
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install 'pandas>=1.5.0' 'PyYAML>=6.0' 'beautifulsoup4>=4.11.0' 'requests>=2.28.0' 'reproschema>=1.0.0'
        python - <<'PY'
import importlib
for m in ('pandas','yaml','bs4','requests'):
    importlib.import_module(m)
print('All dependencies installed successfully')
PY


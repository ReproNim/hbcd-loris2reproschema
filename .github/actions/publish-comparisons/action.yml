name: "Publish Comparisons"
description: "Generate web comparison files and commit to docs"
inputs:
  limit:
    description: "Max versions to include"
    required: false
    default: "15"
runs:
  using: "composite"
  steps:
    - name: Generate comparison files
      shell: bash
      run: |
        python scripts/generate_web_comparisons.py --output-dir docs/data --update-html --limit "${{ inputs.limit }}"

    - name: Commit docs updates
      shell: bash
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/data docs/index.html || true
        if ! git diff --cached --quiet; then
          git commit -m "docs: update comparisons"
          git push origin HEAD
        else
          echo "No docs changes to commit"
        fi


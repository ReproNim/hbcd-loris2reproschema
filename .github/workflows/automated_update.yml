name: Automated LORIS to ReproSchema Update

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      data_dictionary_file:
        description: "Path to data dictionary file to use"
        required: false
        default: ""
      manual_trigger:
        description: "Manual trigger for update"
        required: false
        default: "true"

jobs:
  update:
    uses: ./.github/workflows/reusable-update.yml
    secrets: inherit
    with:
      data_dictionary_file: ${{ github.event.inputs.data_dictionary_file }}

  release:
    needs: update
    if: needs.update.outputs.changes == 'true' && needs.update.outputs.pr_number != ''
    uses: ./.github/workflows/reusable-release.yml
    secrets: inherit
    with:
      pr_number: ${{ needs.update.outputs.pr_number }}

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            reports/
            logs/
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          if [ "${{ needs.check-and-update.outputs.changes }}" = "true" ]; then
            echo "✅ Pipeline completed successfully - PR created: #${{ needs.check-and-update.outputs.pr_number }}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ Pipeline completed successfully - no changes detected" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

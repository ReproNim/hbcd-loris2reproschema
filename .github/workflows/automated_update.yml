name: Automated LORIS to ReproSchema Update

on:
  schedule:
    # Run weekly on Mondays at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      manual_trigger:
        description: 'Manual trigger for update'
        required: false
        default: 'true'

env:
  PYTHON_VERSION: '3.10'

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for proper diffing
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas pyyaml beautifulsoup4 requests reproschema
    
    - name: Run automated update
      env:
        LORIS_USER: ${{ secrets.HBCD_USERNAME }}
        LORIS_PASS: ${{ secrets.HBCD_PASSWORD }}
      run: |
        python scripts/automated_update.py --config update_config.yml
    
    - name: Check for changes
      id: check_changes
      run: |
        if [ -n "$(git status --porcelain reproschema_output/)" ]; then
          echo "changes=true" >> $GITHUB_OUTPUT
        else
          echo "changes=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Create branch and commit
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        BRANCH_NAME="auto-update-$(date +%Y-%m-%d)"
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git checkout -b $BRANCH_NAME
        git add reproschema_output/
        git add quality_report_*.json
        git commit -m "Automated update from LORIS data dictionary $(date +%Y-%m-%d)
        
        This update was automatically generated from the latest LORIS data dictionary.
        Please review the quality report for any issues or warnings."
        echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV
    
    - name: Push changes
      if: steps.check_changes.outputs.changes == 'true'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ env.branch_name }}
    
    - name: Create Pull Request
      if: steps.check_changes.outputs.changes == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ env.branch_name }}
        title: '[Auto] Update ReproSchema from LORIS - ${{ env.branch_name }}'
        body: |
          ## Automated Update from LORIS
          
          This PR contains an automated update generated from the latest LORIS data dictionary.
          
          ### Quality Report Summary
          Please review the attached quality report for:
          - Issues detected and fixed
          - Warnings that may need manual review
          - Statistics about the conversion
          
          ### Checklist
          - [ ] Review quality report
          - [ ] Validate schemas pass all tests
          - [ ] Check for any new data quality issues
          - [ ] Approve if all checks pass
          
          ---
          *This PR was automatically generated by the LORIS to ReproSchema update workflow.*
        labels: |
          automated
          update
          needs-review
    
    - name: Upload quality report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quality-report
        path: |
          quality_report_*.json
          reports/
          logs/
    
    - name: Notify on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Automated LORIS update failed',
            body: `The automated LORIS to ReproSchema update workflow failed.
            
            Please check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.
            
            Date: ${new Date().toISOString()}`,
            labels: ['bug', 'automated', 'needs-attention']
          })
name: Automated LORIS to ReproSchema Update

on:
  schedule:
    # Run weekly on Mondays at 6 AM UTC (after retrieve workflow has time to complete)
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      data_dictionary_file:
        description: "Path to data dictionary file to use"
        required: false
        default: ""
      manual_trigger:
        description: "Manual trigger for update"
        required: false
        default: "true"

env:
  PYTHON_VERSION: "3.10"

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.check_changes.outputs.changes }}
      pr_number: ${{ steps.create_pr.outputs.pull-request-number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml beautifulsoup4 requests reproschema

      - name: Run automated update
        env:
          LORIS_USER: ${{ secrets.HBCD_USERNAME }}
          LORIS_PASS: ${{ secrets.HBCD_PASSWORD }}
        run: |
          if [ -n "${{ github.event.inputs.data_dictionary_file }}" ]; then
            python scripts/automated_update.py --config update_config.yml --csv-file "${{ github.event.inputs.data_dictionary_file }}"
          else
            python scripts/automated_update.py --config update_config.yml
          fi

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        id: create_pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Automated update from LORIS data dictionary $(date +%Y-%m-%d)

            This update was automatically generated from the latest LORIS data dictionary.
          branch: auto-update-$(date +%Y-%m-%d)
          title: "[Auto] Update ReproSchema from LORIS - $(date +%Y-%m-%d)"
          add-paths: |
            reproschema_output/
            reports/
            logs/
          body: |
            ## Automated Update from LORIS

            This PR contains an automated update generated from the latest LORIS data dictionary.

            ### Checklist
            - [ ] Review quality report
            - [ ] Validate schemas pass all tests
            - [ ] Check for any new data quality issues
            - [ ] Approve if all checks pass

            ---
            *This PR was automatically generated by the LORIS to ReproSchema update workflow.*
          labels: |
            automated
            update

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 LORIS to ReproSchema Update Failed - ${new Date().toISOString().split('T')[0]}`,
              body: `The automated LORIS to ReproSchema conversion failed.\n\n**Workflow Run:** ${runUrl}\n**Date:** ${new Date().toISOString()}\n\nCheck the workflow logs and artifacts for details, then re-run once the issue is resolved.`,
              labels: ['bug', 'automated']
            });

  create-release:
    runs-on: ubuntu-latest
    needs: check-and-update
    if: needs.check-and-update.outputs.changes == 'true' && needs.check-and-update.outputs.pr_number != ''
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for PR merge
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = '${{ needs.check-and-update.outputs.pr_number }}';

            // Wait for PR to be merged (with timeout)
            let merged = false;
            let attempts = 0;
            const maxAttempts = 180; // 30 minutes timeout (10 second intervals)

            while (!merged && attempts < maxAttempts) {
              try {
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber
                });

                if (pr.merged) {
                  console.log('✅ PR has been merged');
                  merged = true;
                } else if (pr.state === 'closed') {
                  throw new Error('PR was closed without merging');
                } else {
                  console.log(`⏳ Waiting for PR merge... (attempt ${attempts + 1}/${maxAttempts})`);
                  await new Promise(resolve => setTimeout(resolve, 10000)); // Wait 10 seconds
                  attempts++;
                }
              } catch (error) {
                if (attempts >= maxAttempts - 1) {
                  throw error;
                }
                await new Promise(resolve => setTimeout(resolve, 10000));
                attempts++;
              }
            }

            if (!merged) {
              throw new Error('Timeout waiting for PR merge');
            }

      - name: Pull latest changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull origin main

      - name: Create release tag
        id: create_tag
        run: |
          # Create a tag based on the date
          TAG_NAME="v$(date +%Y.%m.%d)"

          # Check if tag already exists and increment if needed
          COUNTER=1
          ORIGINAL_TAG=$TAG_NAME
          while git tag -l | grep -q "^${TAG_NAME}$"; do
            TAG_NAME="${ORIGINAL_TAG}.${COUNTER}"
            COUNTER=$((COUNTER + 1))
          done

          echo "Creating tag: $TAG_NAME"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          # Create and push tag
          git tag -a "$TAG_NAME" -m "Automated ReproSchema update $(date +%Y-%m-%d)"
          git push origin "$TAG_NAME"

      - name: Create GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = '${{ steps.create_tag.outputs.tag_name }}';

            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `HBCD ReproSchema ${tagName}`,
              body: `# HBCD ReproSchema Update ${tagName}\n\nThis automated release contains updated ReproSchema files generated from the latest LORIS data dictionary.\n\n## Generated Content\n- Updated ReproSchema protocol and activity definitions\n- Latest instrument mappings from HBCD LORIS\n- Automated validation and quality checks applied\n\n---\n*This release was automatically generated by the HBCD LORIS to ReproSchema pipeline.*`,
              draft: false,
              prerelease: false
            });

            console.log(`✅ Created release: ${release.data.html_url}`);

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            reports/
            logs/

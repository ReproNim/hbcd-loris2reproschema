name: Automated LORIS to ReproSchema Update

on:
  schedule:
    # Run weekly on Mondays at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      manual_trigger:
        description: 'Manual trigger for update'
        required: false
        default: 'true'

env:
  PYTHON_VERSION: '3.10'

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.check_changes.outputs.changes }}
      pr_number: ${{ steps.create_pr.outputs.pull-request-number }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for proper diffing
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas pyyaml beautifulsoup4 requests reproschema
    
    - name: Run automated update
      env:
        LORIS_USER: ${{ secrets.HBCD_USERNAME }}
        LORIS_PASS: ${{ secrets.HBCD_PASSWORD }}
      run: |
        python scripts/automated_update.py --config update_config.yml
    
    - name: Check for changes
      id: check_changes
      run: |
        if [ -n "$(git status --porcelain reproschema_output/)" ]; then
          echo "changes=true" >> $GITHUB_OUTPUT
        else
          echo "changes=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Create branch and commit
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        BRANCH_NAME="auto-update-$(date +%Y-%m-%d)"
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git checkout -b $BRANCH_NAME
        git add reproschema_output/
        git add quality_report_*.json
        git commit -m "Automated update from LORIS data dictionary $(date +%Y-%m-%d)
        
        This update was automatically generated from the latest LORIS data dictionary.
        Please review the quality report for any issues or warnings."
        echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV
    
    - name: Push changes
      if: steps.check_changes.outputs.changes == 'true'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ env.branch_name }}
    
    - name: Create Pull Request
      if: steps.check_changes.outputs.changes == 'true'
      id: create_pr
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ env.branch_name }}
        title: '[Auto] Update ReproSchema from LORIS - ${{ env.branch_name }}'
        body: |
          ## Automated Update from LORIS

          This PR contains an automated update generated from the latest LORIS data dictionary.

          ### Quality Report Summary
          Please review the attached quality report for:
          - Issues detected and fixed
          - Warnings that may need manual review
          - Statistics about the conversion

          ### Checklist
          - [ ] Review quality report
          - [ ] Validate schemas pass all tests
          - [ ] Check for any new data quality issues
          - [ ] Approve if all checks pass

          ---
          *This PR was automatically generated by the LORIS to ReproSchema update workflow.*
        labels: |
          automated
          update
          auto-merge-ready

  create-release:
    runs-on: ubuntu-latest
    needs: check-and-update
    if: needs.check-and-update.outputs.changes == 'true' && needs.check-and-update.outputs.pr_number
    steps:
    - name: Checkout main branch
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0

    - name: Wait for PR merge
      uses: actions/github-script@v7
      with:
        script: |
          const prNumber = '${{ needs.check-and-update.outputs.pr_number }}';

          // Wait for PR to be merged (with timeout)
          let merged = false;
          let attempts = 0;
          const maxAttempts = 30; // 5 minutes timeout

          while (!merged && attempts < maxAttempts) {
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });

              if (pr.merged) {
                console.log('✅ PR has been merged');
                merged = true;
              } else if (pr.state === 'closed') {
                throw new Error('PR was closed without merging');
              } else {
                console.log(`⏳ Waiting for PR merge... (attempt ${attempts + 1}/${maxAttempts})`);
                await new Promise(resolve => setTimeout(resolve, 10000)); // Wait 10 seconds
                attempts++;
              }
            } catch (error) {
              if (attempts >= maxAttempts - 1) {
                throw error;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
              attempts++;
            }
          }

          if (!merged) {
            throw new Error('Timeout waiting for PR merge');
          }

    - name: Pull latest changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git pull origin main

    - name: Create release tag
      id: create_tag
      run: |
        # Create a tag based on the date
        TAG_NAME="v$(date +%Y.%m.%d)"

        # Check if tag already exists and increment if needed
        COUNTER=1
        ORIGINAL_TAG=$TAG_NAME
        while git tag -l | grep -q "^${TAG_NAME}$"; do
          TAG_NAME="${ORIGINAL_TAG}.${COUNTER}"
          COUNTER=$((COUNTER + 1))
        done

        echo "Creating tag: $TAG_NAME"
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

        # Create and push tag
        git tag -a "$TAG_NAME" -m "Automated ReproSchema update $(date +%Y-%m-%d)

        Generated from LORIS data dictionary with automated quality checks.

        This release contains updated ReproSchema files with the latest
        instrument definitions and field mappings from the HBCD study."

        git push origin "$TAG_NAME"

    - name: Create GitHub release
      uses: actions/github-script@v7
      with:
        script: |
          const tagName = '${{ steps.create_tag.outputs.tag_name }}';

          // Prepare release notes
          let releaseBody = `# HBCD ReproSchema Update ${tagName}

          This automated release contains updated ReproSchema files generated from the latest LORIS data dictionary.

          ## 🚀 Generated Content
          - Updated ReproSchema protocol and activity definitions
          - Latest instrument mappings from HBCD LORIS
          - Automated validation and quality checks applied

          ## 📁 Files
          The \`reproschema_output/\` directory contains all generated schemas.

          ## 🔄 Workflow
          This release was created automatically after:
          1. Detecting significant changes in the LORIS data dictionary
          2. Converting to ReproSchema format
          3. Running quality checks
          4. Merging updates to main branch

          ---
          *This release was automatically generated by the HBCD LORIS to ReproSchema pipeline.*
          `;

          // Create the release
          const release = await github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: tagName,
            name: `HBCD ReproSchema ${tagName}`,
            body: releaseBody,
            draft: false,
            prerelease: false
          });

          console.log(`✅ Created release: ${release.data.html_url}`);
    
    - name: Upload quality report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quality-report
        path: |
          quality_report_*.json
          reports/
          logs/
    
    - name: Notify on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Automated LORIS update failed',
            body: `The automated LORIS to ReproSchema update workflow failed.
            
            Please check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.
            
            Date: ${new Date().toISOString()}`,
            labels: ['bug', 'automated', 'needs-attention']
          })
name: Automated LORIS to ReproSchema Update

on:
  schedule:
    # Run weekly on Mondays at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      manual_trigger:
        description: 'Manual trigger for update'
        required: false
        default: 'true'

env:
  PYTHON_VERSION: '3.10'

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for proper diffing
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas pyyaml beautifulsoup4 requests reproschema
    
    - name: Run automated update
      env:
        LORIS_USER: ${{ secrets.HBCD_USERNAME }}
        LORIS_PASS: ${{ secrets.HBCD_PASSWORD }}
      run: |
        python scripts/automated_update.py --config update_config.yml
    
    - name: Check for changes
      id: check_changes
      run: |
        if [ -n "$(git status --porcelain reproschema_output/)" ]; then
          echo "changes=true" >> $GITHUB_OUTPUT
        else
          echo "changes=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Create branch and commit
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        BRANCH_NAME="auto-update-$(date +%Y-%m-%d)"
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git checkout -b $BRANCH_NAME
        git add reproschema_output/
        git add quality_report_*.json
        git commit -m "Automated update from LORIS data dictionary $(date +%Y-%m-%d)
        
        This update was automatically generated from the latest LORIS data dictionary.
        Please review the quality report for any issues or warnings."
        echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV
    
    - name: Push changes
      if: steps.check_changes.outputs.changes == 'true'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ env.branch_name }}
    
    - name: Create Pull Request
      if: steps.check_changes.outputs.changes == 'true'
      id: create_pr
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ env.branch_name }}
        title: '[Auto] Update ReproSchema from LORIS - ${{ env.branch_name }}'
        body: |
          ## Automated Update from LORIS

          This PR contains an automated update generated from the latest LORIS data dictionary.

          ### Quality Report Summary
          Please review the attached quality report for:
          - Issues detected and fixed
          - Warnings that may need manual review
          - Statistics about the conversion

          ### Checklist
          - [ ] Review quality report
          - [ ] Validate schemas pass all tests
          - [ ] Check for any new data quality issues
          - [ ] Approve if all checks pass

          ---
          *This PR was automatically generated by the LORIS to ReproSchema update workflow.*
        labels: |
          automated
          update
          needs-review

    - name: Auto-merge PR if quality checks pass
      if: steps.check_changes.outputs.changes == 'true' && steps.create_pr.outputs.pull-request-number
      uses: actions/github-script@v7
      with:
        script: |
          // Get quality report to check if it's safe to auto-merge
          const fs = require('fs');
          const path = require('path');

          // Look for quality report files
          const reportFiles = fs.readdirSync('.').filter(f => f.startsWith('quality_report_'));

          if (reportFiles.length > 0) {
            const reportPath = reportFiles[0];
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));

            // Auto-merge if no critical issues found
            const criticalIssues = report.issues?.filter(i => i.severity === 'error') || [];

            if (criticalIssues.length === 0) {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: ${{ steps.create_pr.outputs.pull-request-number }},
                commit_title: 'Auto-merge: LORIS data dictionary update passed quality checks',
                merge_method: 'squash'
              });

              console.log('✅ PR auto-merged - no critical issues found');
              core.setOutput('auto_merged', 'true');
            } else {
              console.log('⚠️  PR requires manual review - critical issues found:', criticalIssues.length);
              core.setOutput('auto_merged', 'false');
            }
          } else {
            console.log('⚠️  No quality report found - requiring manual review');
            core.setOutput('auto_merged', 'false');
          }

    - name: Create release tag
      if: steps.check_changes.outputs.changes == 'true'
      id: create_tag
      run: |
        # Create a tag based on the date
        TAG_NAME="v$(date +%Y.%m.%d)"

        # Check if tag already exists and increment if needed
        COUNTER=1
        ORIGINAL_TAG=$TAG_NAME
        while git tag -l | grep -q "^${TAG_NAME}$"; do
          TAG_NAME="${ORIGINAL_TAG}.${COUNTER}"
          COUNTER=$((COUNTER + 1))
        done

        echo "Creating tag: $TAG_NAME"
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

        # Create and push tag
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -a "$TAG_NAME" -m "Automated ReproSchema update $(date +%Y-%m-%d)

        Generated from LORIS data dictionary with automated quality checks.

        This release contains updated ReproSchema files with the latest
        instrument definitions and field mappings from the HBCD study."

        git push origin "$TAG_NAME"

    - name: Create GitHub release
      if: steps.check_changes.outputs.changes == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const tagName = '${{ steps.create_tag.outputs.tag_name }}';
          const fs = require('fs');

          // Prepare release notes
          let releaseBody = `# HBCD ReproSchema Update ${tagName}

          This automated release contains updated ReproSchema files generated from the latest LORIS data dictionary.

          ## 📊 Quality Report Summary
          `;

          // Add quality report summary if available
          try {
            const reportFiles = fs.readdirSync('.').filter(f => f.startsWith('quality_report_'));
            if (reportFiles.length > 0) {
              const report = JSON.parse(fs.readFileSync(reportFiles[0], 'utf8'));

              releaseBody += `
          - **Issues Found**: ${report.issues?.length || 0}
          - **Warnings**: ${report.warnings?.length || 0}
          - **Conversion Status**: ${report.success ? '✅ Success' : '❌ Failed'}

          📋 See attached quality report for detailed analysis.
              `;
            }
          } catch (e) {
            releaseBody += `
          Quality report analysis failed. Please check manually.
            `;
          }

          releaseBody += `

          ## 🚀 Generated Content
          - Updated ReproSchema protocol and activity definitions
          - Latest instrument mappings from HBCD LORIS
          - Automated validation and quality checks applied

          ## 📁 Files
          The \`reproschema_output/\` directory contains all generated schemas.

          ---
          *This release was automatically generated by the HBCD LORIS to ReproSchema pipeline.*
          `;

          // Create the release
          const release = await github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: tagName,
            name: `HBCD ReproSchema ${tagName}`,
            body: releaseBody,
            draft: false,
            prerelease: false
          });

          console.log(`✅ Created release: ${release.data.html_url}`);

          // Upload quality report as release asset if available
          const reportFiles = fs.readdirSync('.').filter(f => f.startsWith('quality_report_'));
          if (reportFiles.length > 0) {
            const reportPath = reportFiles[0];
            const reportContent = fs.readFileSync(reportPath);

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: 'quality_report.json',
              data: reportContent
            });

            console.log('📎 Uploaded quality report to release');
          }
    
    - name: Upload quality report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quality-report
        path: |
          quality_report_*.json
          reports/
          logs/
    
    - name: Notify on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Automated LORIS update failed',
            body: `The automated LORIS to ReproSchema update workflow failed.
            
            Please check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.
            
            Date: ${new Date().toISOString()}`,
            labels: ['bug', 'automated', 'needs-attention']
          })
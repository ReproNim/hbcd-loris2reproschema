name: Reusable - Update and PR

on:
  workflow_call:
    inputs:
      data_dictionary_file:
        description: "Path to data dictionary file to use"
        required: false
        type: string
        default: ""
    outputs:
      changes:
        description: "Whether changes were detected"
        value: ${{ jobs.update.outputs.changes }}
      pr_number:
        description: "Created PR number"
        value: ${{ jobs.update.outputs.pr_number }}
    secrets:
      HBCD_USERNAME:
        required: true
      HBCD_PASSWORD:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.check_changes.outputs.changes }}
      pr_number: ${{ steps.create_pr.outputs.pull-request-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.10"

      - name: Verify secrets
        shell: bash
        run: |
          [ -n "${{ secrets.HBCD_USERNAME }}" ] || { echo "HBCD_USERNAME missing"; exit 1; }
          [ -n "${{ secrets.HBCD_PASSWORD }}" ] || { echo "HBCD_PASSWORD missing"; exit 1; }

      - name: Run automated update
        env:
          LORIS_USER: ${{ secrets.HBCD_USERNAME }}
          LORIS_PASS: ${{ secrets.HBCD_PASSWORD }}
        shell: bash
        run: |
          if [ -n "${{ inputs.data_dictionary_file }}" ]; then
            python scripts/automated_update.py --config config/pipeline.yml --csv-file "${{ inputs.data_dictionary_file }}"
          else
            python scripts/automated_update.py --config config/pipeline.yml
          fi

      - name: Check for changes
        id: check_changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            git status --porcelain
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Set date variable
        if: steps.check_changes.outputs.changes == 'true'
        run: echo "CURRENT_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        id: create_pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Automated update from LORIS data dictionary ${{ env.CURRENT_DATE }}

            This update was automatically generated from the latest LORIS data dictionary.
          branch: auto-update-${{ env.CURRENT_DATE }}-${{ github.run_number }}
          title: "[Auto] Update ReproSchema from LORIS - ${{ env.CURRENT_DATE }}"
          add-paths: |
            reproschema_output/
            reports/
            logs/
          body: |
            ## Automated Update from LORIS

            This PR contains an automated update generated from the latest LORIS data dictionary.

            ### Generated Content
            - **ReproSchema Files**: Updated schema definitions in `reproschema_output/`
            - **Quality Report**: Data quality analysis in `reports/`
            - **Processing Logs**: Detailed execution logs in `logs/`

            ### Checklist
            - [ ] Review quality report for any new issues
            - [ ] Validate schemas pass all tests
            - [ ] Check schema comparison report for any significant new data quality issues
            - [ ] Approve if all checks pass

            ---
            *This PR was automatically generated by the LORIS to ReproSchema update workflow.*
          labels: |
            automated
            update

      - name: PR schema diff
        if: steps.check_changes.outputs.changes == 'true'
        id: diff
        uses: ./.github/actions/pr-schema-diff
        with:
          base-ref: main
          head-ref: HEAD

      - name: Append diff summary to PR
        if: steps.check_changes.outputs.changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.create_pr.outputs.pull-request-number }};
            const summary = `${{ steps.diff.outputs.summary }}`;
            const bodyAppend = `\n\n---\n**Schema Diff Summary**\n\n${summary}\n\nFull JSON diff attached as CI artifact (pr-schema-diff).`;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: (pr.body || '') + bodyAppend
            });


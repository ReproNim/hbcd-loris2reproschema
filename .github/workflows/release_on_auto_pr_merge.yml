name: Release on Auto-PR Merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'auto-update-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create release tag
        id: tag
        run: |
          TAG_NAME="v$(date +%Y.%m.%d)"
          COUNTER=1
          ORIGINAL_TAG=$TAG_NAME
          while git tag -l | grep -q "^${TAG_NAME}$"; do
            TAG_NAME="${ORIGINAL_TAG}.${COUNTER}"
            COUNTER=$((COUNTER + 1))
          done
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          git tag -a "$TAG_NAME" -m "Automated ReproSchema update $(date +%Y-%m-%d)"
          git push origin "$TAG_NAME"

      - name: Create GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = '${{ steps.tag.outputs.tag_name }}';
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `HBCD ReproSchema ${tagName}`,
              body: `# HBCD ReproSchema Update ${tagName}\n\nAutomated release with updated schemas.`,
              draft: false,
              prerelease: false
            });
            console.log(`✅ Created release: ${release.data.html_url}`);

      - name: Setup Python
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.10"

      - name: Publish comparisons
        uses: ./.github/actions/publish-comparisons
        with:
          limit: "15"

